name: Lint Codebase

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint "**/*.js"

      - name: Run Stylelint
        run: npx stylelint "**/*.css"

      - name: Run HTMLHint
        run: npx htmlhint "**/*.html"
